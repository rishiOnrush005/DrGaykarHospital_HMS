{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" class="bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dr. Gaykar Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-20">
    <!-- Top Navbar -->
    <nav class="glass-nav sticky top-0 z-50 border-b border-slate-100 px-4 py-3">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="flex items-center gap-2">
                <div class="bg-indigo-600 p-1.5 rounded-xl text-white">
                    <i class="bi bi-plus-square-fill"></i>
                </div>
                <span class="font-bold tracking-tight text-slate-900">Dr. Gaykar</span>
            </a>
            
            <div class="flex items-center gap-4">
                <!-- Language Switcher -->
                <form action="{% url 'set_language_pref' %}" method="post" class="flex items-center">
                    {% csrf_token %}
                    <select name="language" onchange="this.form.submit()" class="bg-slate-100 border-none rounded-xl text-xs font-bold py-1.5 px-3 outline-none focus:ring-0">
                        <option value="en" {% if request.LANGUAGE_CODE == 'en' %}selected{% endif %}>{% trans "EN" %}</option>
                        <option value="mr" {% if request.LANGUAGE_CODE == 'mr' %}selected{% endif %}>{% trans "मराठी" %}</option>
                    </select>
                </form>
                
                <form action="{% url 'logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-slate-400 hover:text-rose-500 transition-colors bg-transparent border-none p-0">
                        <i class="bi bi-box-arrow-right fs-5"></i>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 md:p-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm flex items-center gap-3 animate-fade-in">
                    <i class="bi bi-info-circle-fill text-indigo-500"></i>
                    <p class="text-sm font-medium">{{ message }}</p>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
